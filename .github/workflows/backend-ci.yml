name: Backend CI
on:
  pull_request:
    paths: ['services/**', 'go.mod', 'go.sum', 'tests/**', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Encore CLI
        run: |
          curl --fail --location --retry 3 https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Configure disposable local application
        run: |
          printf '{}\n' > encore.app
          printf 'JWTSecret: "nodeplane-ci-only-secret-never-use-in-production"\n' > secrets.local.cue
          mkdir -p test-results/backend
          encore version
      - name: Backend unit and database regression tests
        shell: bash
        run: |
          set -o pipefail
          encore test -v -count=1 ./... 2>&1 | tee test-results/backend/go-test.log
      - name: Real API and persistence workflows
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NODEPLANE_E2E_DISPOSABLE: '1'
        run: |
          set -euo pipefail
          python3 tests/fixtures/server.py > test-results/backend/fixtures.log 2>&1 &
          FIXTURE_PID=$!
          encore run --port 4000 > test-results/backend/server.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FIXTURE_PID" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 120); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/auth/me || true)" = '401' ]; then ready=true; break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then cat test-results/backend/server.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" != 'true' ]; then cat test-results/backend/server.log; exit 1; fi
          python3 tests/functional_api.py 2>&1 | tee test-results/backend/functional-api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodeplane-backend-tests
          path: test-results/backend/
          retention-days: 14
