name: Backend CI
on:
  pull_request:
    paths: ['services/**', 'go.mod', 'go.sum', 'tests/**', '.github/workflows/backend-ci.yml']
  push:
    branches: ['codex/nodeplane-asharca-ui']
    paths: ['services/**', 'go.mod', 'go.sum', 'tests/**', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Encore CLI
        run: |
          curl --fail --location --retry 3 https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Configure disposable local application
        run: |
          printf '{}\n' > encore.app
          printf 'JWTSecret: "nodeplane-ci-only-secret-never-use-in-production"\n' > secrets.local.cue
          mkdir -p test-results/backend
          encore version
      - name: Backend unit and database regression tests
        shell: bash
        run: |
          set -o pipefail
          encore test -v -count=1 ./... 2>&1 | tee test-results/backend/go-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodeplane-backend-tests
          path: test-results/backend/
          retention-days: 14
