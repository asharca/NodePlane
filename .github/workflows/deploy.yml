name: deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
      - 'tests/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - 'deploy/**'
      - 'frontend/**'
      - 'services/**'
      - 'go.mod'
      - 'go.sum'
      - 'encore.app'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      migrator_image: ${{ steps.images.outputs.migrator_image }}
      sha_tag: ${{ steps.images.outputs.sha_tag }}
      release_tag: ${{ steps.images.outputs.release_tag }}
      publish: ${{ steps.images.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test container image metadata
        run: python3 -m unittest discover -s tests -p test_image_metadata.py -v
      - name: Resolve lowercase image repositories
        id: images
        run: bash .github/scripts/image-metadata.sh >> "$GITHUB_OUTPUT"
      - name: Validate volume deployment contract
        run: python3 -m unittest discover -s tests -p test_compose_config.py -v

  build-images:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, migrator]
    env:
      IMAGE_PREFIX: ${{ needs.metadata.outputs.backend_image }}
      IMAGE_TAG: ${{ needs.metadata.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select image
        run: |
          suffix=''
          if [[ '${{ matrix.component }}' != backend ]]; then suffix='-${{ matrix.component }}'; fi
          echo "IMAGE=${IMAGE_PREFIX}${suffix}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        if: matrix.component == 'backend'
        with:
          go-version-file: go.mod
      - name: Install Encore CLI
        if: matrix.component == 'backend'
        run: |
          curl --fail --location --retry 3 https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Build backend with embedded internal database configuration
        if: matrix.component == 'backend'
        run: encore build docker --config deploy/infra.config.json "$IMAGE:$IMAGE_TAG"
      - uses: docker/setup-buildx-action@v3
        if: matrix.component != 'backend'
      - name: Build frontend or offline migrator
        if: matrix.component != 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.component == 'frontend' && './frontend/Dockerfile' || './deploy/migrator.Dockerfile' }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
      - name: Save image for full-stack verification before publishing
        run: |
          docker image inspect "$IMAGE:$IMAGE_TAG" > /dev/null
          docker save "$IMAGE:$IMAGE_TAG" | gzip -1 > "$RUNNER_TEMP/${{ matrix.component }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: nodeplane-image-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.tar.gz
          retention-days: 1
          compression-level: 0

  verify-and-publish:
    needs: [metadata, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      NODEPLANE_IMAGE_PREFIX: ${{ needs.metadata.outputs.backend_image }}
      SUBS_CHECK_IMAGE_TAG: ${{ needs.metadata.outputs.sha_tag }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: nodeplane-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/nodeplane-images
      - name: Load the exact images that will be published
        run: |
          for component in backend frontend migrator; do
            gzip -dc "$RUNNER_TEMP/nodeplane-images/$component.tar.gz" | docker load
          done
      - name: Real Compose first boot, migration failure and volume persistence
        env:
          NODEPLANE_COMPOSE_TEST_DISPOSABLE: '1'
        run: timeout --signal=TERM --kill-after=20s 480s python3 tests/compose_volume_smoke.py
      - name: Upload deployment regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeplane-compose-volume-tests
          path: test-results/compose/
          retention-days: 14
      - name: Log in to GHCR
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish all three verified version-matched images
        if: needs.metadata.outputs.publish == 'true'
        run: |
          for suffix in '' '-frontend' '-migrator'; do
            image="${NODEPLANE_IMAGE_PREFIX}${suffix}"
            docker push "$image:$SUBS_CHECK_IMAGE_TAG"
            docker tag "$image:$SUBS_CHECK_IMAGE_TAG" "$image:$RELEASE_TAG"
            docker push "$image:$RELEASE_TAG"
          done

  deploy:
    needs: [metadata, verify-and-publish]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          : "${COOLIFY_WEBHOOK:?Missing COOLIFY_WEBHOOK secret}"
          : "${COOLIFY_TOKEN:?Missing COOLIFY_TOKEN secret}"
          separator='?'
          if [[ "$COOLIFY_WEBHOOK" == *\?* ]]; then separator='&'; fi
          curl --fail-with-body --connect-timeout 15 --max-time 60 "${COOLIFY_WEBHOOK}${separator}force=true" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
