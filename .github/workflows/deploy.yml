name: deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/scripts/image-metadata.sh'
      - 'tests/test_image_metadata.py'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'frontend/**'
      - 'services/**'
      - 'go.mod'
      - 'go.sum'
      - 'encore.app'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      sha_tag: ${{ steps.images.outputs.sha_tag }}
      release_tag: ${{ steps.images.outputs.release_tag }}
      publish: ${{ steps.images.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test container image metadata
        run: python3 -m unittest discover -s tests -p test_image_metadata.py -v
      - name: Resolve lowercase image repositories
        id: images
        run: bash .github/scripts/image-metadata.sh >> "$GITHUB_OUTPUT"
      - name: Validate Compose image references
        env:
          NODEPLANE_IMAGE_PREFIX: ${{ steps.images.outputs.backend_image }}
          SUBS_CHECK_IMAGE_TAG: ${{ steps.images.outputs.sha_tag }}
          DB_USER: ci
          DB_PASSWORD: ci-validation-only
          JWT_SECRET: ci-validation-only
          BASE_URL: http://localhost
        run: |
          docker compose config --quiet
          docker compose config --images | tee /tmp/nodeplane-images.txt
          grep -Fx "${NODEPLANE_IMAGE_PREFIX}:${SUBS_CHECK_IMAGE_TAG}" /tmp/nodeplane-images.txt
          grep -Fx "${NODEPLANE_IMAGE_PREFIX}-frontend:${SUBS_CHECK_IMAGE_TAG}" /tmp/nodeplane-images.txt

  build-backend:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.metadata.outputs.backend_image }}
      IMAGE_TAG: ${{ needs.metadata.outputs.sha_tag }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Encore CLI
        run: |
          curl --fail --location --retry 3 https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image (Encore self-host)
        run: |
          encore build docker --config deploy/infra.config.json "$IMAGE:$IMAGE_TAG"
          docker image inspect "$IMAGE:$IMAGE_TAG" > /dev/null
      - name: Push backend image
        if: needs.metadata.outputs.publish == 'true'
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"

  build-frontend:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.metadata.outputs.frontend_image }}
      IMAGE_TAG: ${{ needs.metadata.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: |
            ${{ needs.metadata.outputs.frontend_image }}:${{ needs.metadata.outputs.sha_tag }}
            ${{ needs.metadata.outputs.frontend_image }}:${{ needs.metadata.outputs.release_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Smoke-test frontend image
        run: |
          docker run --detach --name nodeplane-frontend-smoke -p 127.0.0.1:3000:3000 "$IMAGE:$IMAGE_TAG"
          trap 'docker logs nodeplane-frontend-smoke; docker rm -f nodeplane-frontend-smoke' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Frontend container did not serve /login' >&2
          exit 1
      - name: Push frontend image
        if: needs.metadata.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"

  deploy:
    needs: [metadata, build-backend, build-frontend]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_API_URL: https://coolify.rhzy.ai/api/v1
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          : "${COOLIFY_APP_UUID:?Missing COOLIFY_APP_UUID secret}"
          : "${COOLIFY_TOKEN:?Missing COOLIFY_TOKEN secret}"
          response="$(curl --silent --show-error --request POST \
            --connect-timeout 15 --max-time 60 \
            "${COOLIFY_API_URL}/deploy" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg uuid "$COOLIFY_APP_UUID" '{uuid: $uuid, force: true}')" \
            --write-out $'\nHTTP_STATUS:%{http_code}')"
          http_status="${response##*$'\n'HTTP_STATUS:}"
          response="${response%$'\n'HTTP_STATUS:*}"
          if (( http_status < 200 || http_status >= 300 )); then
            printf 'Coolify deploy request failed (HTTP %s): %s\n' "$http_status" "$response" >&2
            exit 1
          fi
          deployment_uuid="$(jq -er '.deployments[0].deployment_uuid // .deployment_uuid // empty' <<<"$response")" || {
            printf 'Coolify deploy response has no deployment UUID: %s\n' "$response" >&2
            exit 1
          }
          echo "Coolify deployment: ${deployment_uuid}"
          echo "Coolify deployment UUID: ${deployment_uuid}" >> "$GITHUB_STEP_SUMMARY"

          for attempt in $(seq 1 60); do
            deployment="$(curl --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              "${COOLIFY_API_URL}/deployments/${deployment_uuid}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --write-out $'\nHTTP_STATUS:%{http_code}')"
            http_status="${deployment##*$'\n'HTTP_STATUS:}"
            deployment="${deployment%$'\n'HTTP_STATUS:*}"
            if (( http_status < 200 || http_status >= 300 )); then
              printf 'Coolify deployment query failed (HTTP %s): %s\n' "$http_status" "$deployment" >&2
              exit 1
            fi
            status="$(jq -r '.status // "unknown"' <<<"$deployment")"
            echo "Coolify deployment status: ${status}"
            if [[ "$status" == finished || "$status" == failed || "$status" == error || "$status" == cancelled ]]; then
              logs="$(jq -r '
                .logs // "No deployment logs returned."
                | if type == "string" then (fromjson? // .) else . end
                | if type == "array" then
                    .[] | select(.hidden != true) | "[\(.timestamp // "")][\(.type // "log")] \(.output // "")"
                  else tostring end
              ' <<<"$deployment")"
              printf '%s\n' "$logs"
              {
                echo "### Coolify deployment"
                echo "- UUID: \`${deployment_uuid}\`"
                echo "- Status: \`${status}\`"
                echo
                echo '```text'
                printf '%s\n' "$logs" | tail -200
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              [[ "$status" == finished ]]
              exit
            fi
            sleep 10
          done
          echo 'Coolify deployment did not finish within 10 minutes.' >&2
          exit 1
