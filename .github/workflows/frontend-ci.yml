name: Frontend CI
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: ['codex/nodeplane-asharca-ui']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check-types
      - name: Unit and component tests
        run: bun run test:unit
      - name: Production build
        run: bun run build
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/nodeplane-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          "$RUNNER_TEMP/nodeplane-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke tests (mocked API)
        env:
          PLAYWRIGHT_RUNTIME: ${{ runner.temp }}/nodeplane-browser
        run: |
          PORT=3000 HOST=127.0.0.1 node .output/server/index.mjs > "$RUNNER_TEMP/nodeplane-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:3000/login > /dev/null && break
            sleep 1
          done
          node scripts/ui-smoke.mjs
      - name: Upload UI screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeplane-ui-preview
          path: frontend/test-results/ui/
          retention-days: 14
