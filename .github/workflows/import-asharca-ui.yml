name: Import pinned Asharca UI
on:
  push:
    branches: ['codex/nodeplane-asharca-ui']
    paths: ['.github/workflows/import-asharca-ui.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/codex/nodeplane-asharca-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nodeplane-asharca-ui
      - uses: actions/checkout@v4
        with:
          repository: asharca/ui
          ref: df97cdeb2306dcf3453bb4db4e93c70060163bf0
          path: .asharca-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Copy registry source and record provenance
        run: |
          node --input-type=module <<'JS'
          import { mkdir, readFile, writeFile, copyFile, access } from 'node:fs/promises';
          import { resolveFiles } from './.asharca-upstream/registry/catalog.mjs';
          const selected = ['workspace-shell', 'button', 'input', 'textarea', 'search-input', 'checkbox', 'badge', 'status-badge', 'empty-state', 'progress', 'skeleton', 'card', 'page', 'section', 'panel', 'toolbar', 'field', 'spinner', 'copy-button', 'dialog', 'select', 'switch', 'tabs', 'tooltip'];
          const entries = [...new Map(selected.flatMap(resolveFiles).map(entry => [entry.slug, entry])).values()];
          const destination = 'frontend/src/components/asharca';
          await mkdir(destination, { recursive: true });
          for (const entry of entries) {
            let copied = false;
            for (const ext of ['tsx', 'ts']) {
              const source = `.asharca-upstream/registry/ui/${entry.slug}.${ext}`;
              try { await access(source); } catch { continue; }
              await copyFile(source, `${destination}/${entry.slug}.${ext}`);
              copied = true;
              break;
            }
            if (!copied) throw new Error(`Missing registry source: ${entry.slug}`);
          }
          await copyFile('.asharca-upstream/LICENSE', `${destination}/LICENSE`);
          await writeFile(`${destination}/registry-source.json`, JSON.stringify({ repository: 'asharca/ui', commit: 'df97cdeb2306dcf3453bb4db4e93c70060163bf0', documentation: 'https://asharca.github.io/ui/llms.txt', entries: selected, files: entries.map(entry => entry.slug) }, null, 2) + '\n');
          const pkg = JSON.parse(await readFile('frontend/package.json', 'utf8'));
          pkg.dependencies.motion = '^12.0.0';
          pkg.dependencies['radix-ui'] = '1.6.2';
          await writeFile('frontend/package.json', JSON.stringify(pkg, null, '\t') + '\n');
          JS
      - name: Resolve and lock component dependencies
        working-directory: frontend
        run: bun install --ignore-scripts
      - name: Commit imported sources only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/asharca frontend/package.json frontend/bun.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore(ui): vendor Asharca UI at df97cde with locked dependencies'
          git push origin HEAD:codex/nodeplane-asharca-ui
