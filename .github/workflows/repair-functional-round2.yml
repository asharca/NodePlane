name: Repair functional regressions
on:
  push:
    branches: ['codex/nodeplane-asharca-ui']
    paths: ['.github/workflows/repair-functional-round2.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/codex/nodeplane-asharca-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nodeplane-asharca-ui
      - name: Apply guarded edits and check test syntax
        run: |
          python3 tests/repair-functional-round2.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/queries/subscriptions.test.ts')
          s = p.read_text()
          s = s.replace('params: { kind:', 'params: { name: "Fixture", url: "", cron_expr: "", export_include_dead: false, export_sort: "speed_desc", kind:')
          s = s.replace('url: "", cron_expr: "", export_include_dead: false, export_sort: "speed_desc", kind: "subscription", url:', 'cron_expr: "", export_include_dead: false, export_sort: "speed_desc", kind: "subscription", url:')
          p.write_text(s)
          PY
          gofmt -w services/checker/rule_eval.go
          python3 -m py_compile tests/functional_api.py tests/fixtures/server.py tests/check_docs.py
          node --check frontend/scripts/functional-browser.mjs
          python3 tests/check_docs.py
          rm tests/repair-functional-round2.py .github/workflows/repair-functional-round2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix: roll back failed node imports and reject invalid test-node ids'
          git push origin HEAD:codex/nodeplane-asharca-ui
