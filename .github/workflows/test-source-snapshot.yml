name: Test source snapshot
on:
  push:
    branches: ['codex/nodeplane-asharca-ui']
    paths: ['.github/workflows/test-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/nodeplane-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: nodeplane-test-source
          path: ${{ runner.temp }}/nodeplane-source.tar
          retention-days: 1
