services:
  postgres:
    # Pin the major version: PostgreSQL 18 uses a different PGDATA layout.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-nodeplane}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify or .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    # No host port: the database is only reachable on the internal data network.

  migrator:
    image: ${NODEPLANE_IMAGE_PREFIX:-ghcr.io/asharca/nodeplane}-migrator:${SUBS_CHECK_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      DB_USER: ${DB_USER:-nodeplane}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify or .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    # Script, client and SQL are in the image. No repo bind mounts or downloads.

  nsq:
    image: nsqio/nsq:latest
    command: ["/nsqd", "--data-path=/data"]
    volumes:
      - nsq_data:/data
    networks:
      - data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4151/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${NODEPLANE_IMAGE_PREFIX:-ghcr.io/asharca/nodeplane}:${SUBS_CHECK_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      DB_USER: ${DB_USER:-nodeplane}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify or .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify or .env}
      REGISTER_INVITE_CODE: ${REGISTER_INVITE_CODE:?Set REGISTER_INVITE_CODE in Coolify or .env}
      BASE_URL: ${BASE_URL:-http://localhost:18080/api}
    # Encore embeds deploy/infra.config.json during image build (postgres:5432).
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      nsq:
        condition: service_healthy
    networks:
      - default
      - data
    restart: on-failure:5

  frontend:
    image: ${NODEPLANE_IMAGE_PREFIX:-ghcr.io/asharca/nodeplane}-frontend:${SUBS_CHECK_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ENCORE_URL: http://backend:8080
    ports:
      - "18080:3000"
    depends_on:
      - backend
    networks:
      - default
    restart: unless-stopped

# Keep the same Compose project/Coolify resource to reuse these volumes.
# Removing a container is safe; removing these volumes destroys persisted data.
volumes:
  postgres_data:
  nsq_data:

networks:
  default:
  data:
    internal: true
